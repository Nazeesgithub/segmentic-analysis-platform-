<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SegmentIQ Platform Register</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main style="max-width: 520px; margin: 48px auto; padding: 0 16px">
      <section class="card">
        <h2>Create Platform Account</h2>
        <p>Register a user account for campaign and segment operations.</p>
        {% if message %}
        <div class="result">{{ message }}</div>
        {% endif %}
        <form method="post" class="form-grid">
          <div>
            <label for="full_name">Full Name</label>
            <input id="full_name" name="full_name" type="text" />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
          </div>
          <button class="primary" type="submit">Register</button>
        </form>
        <p style="margin-top: 10px">
          Already registered? <a href="/platform/login">Login</a>
        </p>
      </section>
    </main>
  </body>
</html>
