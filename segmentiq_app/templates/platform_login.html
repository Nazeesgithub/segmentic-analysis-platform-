<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SegmentIQ Platform Login</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main style="max-width: 520px; margin: 48px auto; padding: 0 16px">
      <section class="card">
        <h2>Platform Login</h2>
        <p>
          Login to assign new users to business segments and drive campaign
          decisions.
        </p>
        {% if message %}
        <div class="result">{{ message }}</div>
        {% endif %}
        <form method="post" class="form-grid">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
          </div>
          <button class="primary" type="submit">Login</button>
        </form>
        <p style="margin-top: 10px">
          New user? <a href="/platform/register">Create account</a>
        </p>
        <p style="margin-top: 6px"><a href="/">Back to analytics app</a></p>
      </section>
    </main>
  </body>
</html>
